[project]
name = "stretch-demo"
version = "0.1.0"
description = "One-terminal IMU -> MuJoCo Stretch 4 showcase demo: self-feeding, floor pickup and door tasks"
readme = "README.md"
authors = [
    { name = "prometheus", email = "human.robot.empowerment@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "mujoco>=3.12.0",
    "numpy>=2.5.2",
    "scipy>=1.18.1",
    "ximu3>=1.8.1",
]

[project.scripts]
demo = "stretch_demo.cli:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

# Same rule as mujoco-sim: no function above a cognitive complexity of 10.
# tests/test_complexity.py enforces it; the only allowed exceptions are the ones
# registered (with the reason) in COMPLEXITY.md.
[tool.complexipy]
paths = ["src", "tests"]
max-complexity-allowed = 10

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "complexipy>=8.3.0",
    "pytest>=8.4",
]
